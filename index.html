<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celo & Gabo | Brisas del Lago - Maracaibo, Zulia</title>
  <meta name="description" content="Disfruta en familia frente al Lago de Maracaibo en Brisas del Lago. Cervezas vestidas de novia bien frías, enramadas, comida, forros térmicos, tortas venezolanas y quesillos por encargo." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul-lago: #062849;
      --azul-medio: #0b4f8a;
      --turquesa: #00a8cc;
      --turquesa-claro: #e0f7fa;
      --sol-dorado: #ffb703;
      --sol-brillante: #ffd166;
      --arena: #fdf8ee;
      --arena-oscura: #f3e6cc;
      --verde-palma: #1b8a4b;
      --whatsapp: #25d366;
      --whatsapp-dark: #1ebe5d;
      --texto: #18293a;
      --texto-suave: #4a6075;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--texto);
      background-color: var(--arena);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, .brand-font {
      font-family: 'Fredoka', sans-serif;
    }

    /* NAVEGACIÓN */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(6, 40, 73, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 3px solid var(--sol-dorado);
      padding: 0.75rem 5%;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--blanco);
    }

    .nav-brand img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 36%;
      border: 2px solid var(--sol-dorado);
    }

    .nav-brand span {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--sol-brillante), #48cae4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--blanco);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.25s;
    }

    nav a:hover {
      color: var(--sol-brillante);
    }

    /* BOTONES */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9rem 1.75rem;
      border-radius: 50px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      cursor: pointer;
      border: none;
      font-size: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }

    .btn-whatsapp {
      background-color: var(--whatsapp);
      color: var(--blanco);
    }

    .btn-whatsapp:hover {
      background-color: var(--whatsapp-dark);
    }

    .btn-sol {
      background: linear-gradient(135deg, var(--sol-dorado), #fb8500);
      color: var(--azul-lago);
    }

    /* SECCIÓN INICIO (HERO CON PUENTE SOBRE EL LAGO) */
    .hero {
      background-image:
        linear-gradient(
          180deg,
          rgba(6, 40, 73, 0.78) 0%,
          rgba(11, 79, 138, 0.72) 55%,
          rgba(6, 40, 73, 0.88) 100%
        ),
        url('puente.jpg');
      background-size: cover;
      background-position: center 45%;
      background-attachment: fixed;
      color: var(--blanco);
      padding: 4.5rem 5% 6rem;
      position: relative;
      text-align: center;
    }

    .hero-inner {
      max-width: 1150px;
      margin: 0 auto;
    }

    .hero-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      margin-bottom: 3.5rem;
    }

    /* LOGO CIRCULAR ENMARCADO PROFESIONAL */
    .logo-ring {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, var(--sol-brillante), var(--sol-dorado), var(--turquesa));
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-logo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 36%;
      background: var(--azul-lago);
    }

    .badge-zulia {
      display: inline-block;
      background: rgba(6, 40, 73, 0.75);
      backdrop-filter: blur(6px);
      border: 1.5px solid var(--sol-brillante);
      color: var(--sol-brillante);
      padding: 0.45rem 1.25rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .hero h1 {
      font-size: clamp(2.2rem, 4.6vw, 3.6rem);
      line-height: 1.15;
      max-width: 850px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .hero p.lead {
      font-size: 1.16rem;
      max-width: 720px;
      color: #f0f9ff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }

    /* DESTACADOS EN INICIO */
    .hero-products-title {
      font-size: 1.55rem;
      color: var(--sol-brillante);
      margin-bottom: 1.4rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      gap: 1.25rem;
      text-align: left;
    }

    .hero-card {
      background: rgba(6, 40, 73, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 209, 102, 0.35);
      border-radius: 20px;
      padding: 1.5rem;
      transition: transform 0.25s, background 0.25s, border-color 0.25s;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22);
    }

    .hero-card:hover {
      transform: translateY(-5px);
      background: rgba(6, 40, 73, 0.82);
      border-color: var(--sol-brillante);
    }

    .hero-card .icon {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    .hero-card h3 {
      color: var(--sol-brillante);
      font-size: 1.25rem;
      margin-bottom: 0.35rem;
    }

    .hero-card p {
      font-size: 0.94rem;
      color: #e8f6ff;
    }

    /* OLA SEPARADORA */
    .wave-divider {
      display: block;
      width: 100%;
      height: 55px;
      margin-top: -54px;
      position: relative;
      z-index: 2;
    }

    /* SECCIONES GENERALES */
    section.content-section {
      padding: 4.5rem 5%;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3rem;
